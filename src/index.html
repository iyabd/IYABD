<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IYABD SHOP - Admin Panel</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body class="dark">
    <div id="iyabd-loader">
      <div class="iyabd-logo">IYABD SHOP</div>
      <div class="iyabd-spinner"></div>
      <p>IYABD SHOP Loading...</p>
    </div>
    <app-root></app-root>
    <script>
      window.addEventListener("load", function () {
        setTimeout(function() {
          const loader = document.getElementById("iyabd-loader");
          if (loader) {
            loader.style.opacity = "0";
            setTimeout(() => loader.style.display = "none", 500);
          }
        }, 1000);
      });
    </script>
  </body>
</html>
